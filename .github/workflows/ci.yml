name: CI

on:
  pull_request:
  push:
    branches: [production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Host ports match the defaults in test/setup-env.ts.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ssmarket
          POSTGRES_PASSWORD: ssmarket
          POSTGRES_DB: ssmarket_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ssmarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:cov
      - run: pnpm build
      - run: docker build -t ssmarket-be:ci .
